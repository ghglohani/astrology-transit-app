name: Build Android APK (Fast Web Native)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Android App with Cordova
      run: |
        npm install -g cordova
        cordova create astroApp org.astro.transit AstroTransit
        cp index.html astroApp/www/index.html
        cd astroApp
        cordova platform add android
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RealAstro-APK
        path: astroApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
