name: Build Android APK (HTML5 Native)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK & Command Line Tools
      run: |
        mkdir -p android-sdk/cmdline-tools
        cd android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest

    - name: Build Webview Cordova App
      run: |
        npm install -g cordova
        cordova create astroApp org.astro.transit AstroTransit
        cp index.html astroApp/www/index.html
        cd astroApp
        cordova platform add android
        cordova build android --debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: RealAstro-APK
        path: astroApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
